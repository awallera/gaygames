<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌈 GAY GAMES — Slither</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@500;700;900&display=swap');

:root {
  --pink: #F72585; --purple: #7B2FBE; --blue: #4361EE;
  --cyan: #4CC9F0; --green: #06D6A0; --yellow: #FFD166;
  --orange: #FF8C42; --red: #FF4B6E; --bg: #08000F;
}
* { margin:0; padding:0; box-sizing:border-box; cursor:none !important; }
body { background:var(--bg); overflow:hidden; font-family:'Nunito',sans-serif; color:white; width:100vw; height:100vh; cursor:none;
  /* Prevent iOS rubber-band scrolling */
  position:fixed; overscroll-behavior:none; -webkit-overflow-scrolling:touch; }

/* Safe area for iPhone notch + home bar */
#hud { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#boost-bar-wrap { bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
#controls-hint { bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
#kill-feed { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }

/* Virtual joystick */
#joystick-wrap {
  position: fixed; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); left: 40px;
  z-index: 15; pointer-events: all; display: none;
}
#joystick-base {
  width: 100px; height: 100px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15);
  position: relative; backdrop-filter: blur(4px);
}
#joystick-knob {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  box-shadow: 0 0 16px rgba(247,37,133,0.5);
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  transition: none;
}
#boost-btn {
  position: fixed; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); right: 40px;
  width: 80px; height: 80px; border-radius: 50%; z-index: 15; pointer-events: all;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  border: none; cursor: pointer; display: none;
  font-family: 'Fredoka One', cursive; font-size: 0.8rem; color: white;
  box-shadow: 0 4px 20px rgba(247,37,133,0.5); letter-spacing: 0.05em;
  align-items: center; justify-content: center; flex-direction: column; gap: 2px;
}
#boost-btn span { font-size: 1.2rem; }

/* On mobile, shrink leaderboard and score */
@media (max-width: 480px) {
  #leaderboard { min-width: 140px; padding: 10px 12px; font-size: 0.7rem; top: calc(14px + env(safe-area-inset-top, 0px)); right: 10px; }
  #leaderboard h3 { font-size: 0.8rem; }
  #score-display { font-size: 1rem; top: calc(14px + env(safe-area-inset-top, 0px)); }
  #boost-bar-wrap { display: none; } /* hidden on mobile — boost btn replaces it */
  #controls-hint { display: none; }
}
#gameCanvas { display:block; cursor:none; }

/* HUD */
#hud { position:fixed; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:10; }
#score-display {
  position:absolute; top:20px; left:50%; transform:translateX(-50%);
  font-family:'Fredoka One',cursive; font-size:1.4rem;
  background:rgba(0,0,0,0.5); padding:8px 24px; border-radius:50px;
  border:2px solid rgba(255,255,255,0.15); backdrop-filter:blur(10px);
}
#score-display span { background:linear-gradient(90deg,var(--pink),var(--cyan)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
#leaderboard {
  position:absolute; top:20px; right:20px;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1); border-radius:16px;
  padding:14px 18px; min-width:190px; font-size:0.8rem; font-weight:700;
}
#leaderboard h3 { font-family:'Fredoka One',cursive; font-size:1rem; margin-bottom:10px; letter-spacing:0.05em; background:linear-gradient(90deg,var(--yellow),var(--orange)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.lb-entry { display:flex; justify-content:space-between; gap:12px; margin:4px 0; }
#ping-display { position:absolute; top:20px; left:20px; font-size:0.7rem; opacity:0.4; font-weight:700; }
#boost-bar-wrap { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); text-align:center; }
#boost-label { font-size:0.65rem; letter-spacing:0.15em; opacity:0.5; margin-bottom:5px; }
#boost-bar-bg { width:160px; height:8px; background:rgba(255,255,255,0.1); border-radius:4px; overflow:hidden; }
#boost-bar { height:100%; width:100%; background:linear-gradient(90deg,var(--pink),var(--yellow)); border-radius:4px; transition:width 0.1s; box-shadow:0 0 8px rgba(247,37,133,0.6); }
#controls-hint { position:absolute; bottom:30px; right:20px; font-size:0.65rem; opacity:0.3; letter-spacing:0.08em; line-height:2; text-align:right; }
#minimap-wrap { position:absolute; bottom:22px; left:14px; pointer-events:none; z-index:15; }
#minimap { border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.6); display:block; }
#minimap-label { font-size:0.55rem; opacity:0.35; text-align:center; margin-top:2px; letter-spacing:0.1em; font-weight:700; }
#version-label { position:absolute; bottom:6px; left:14px; font-size:0.55rem; opacity:0.25; font-weight:700; letter-spacing:0.08em; pointer-events:none; }
#kill-feed { position:absolute; bottom:80px; left:20px; font-size:0.75rem; font-weight:700; }
.kill-msg { background:rgba(0,0,0,0.5); padding:4px 12px; border-radius:20px; margin-top:4px; animation:fadeKill 3s forwards; border-left:3px solid var(--pink); }
@keyframes fadeKill { 0%,70%{opacity:1} 100%{opacity:0} }

/* Screens */
#start-screen, #dead-screen, #connecting-screen {
  position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(8,0,15,0.95); backdrop-filter:blur(8px); gap:16px;
}
#dead-screen, #connecting-screen { display:none; }
.screen-title {
  font-family:'Fredoka One',cursive; font-size:clamp(2.5rem,8vw,5rem); letter-spacing:0.05em;
  background:linear-gradient(135deg,var(--red),var(--orange),var(--yellow),var(--green),var(--blue),var(--purple),var(--pink));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  background-size:200% auto; animation:rainbowShift 3s linear infinite;
  filter:drop-shadow(0 0 30px rgba(247,37,133,0.4));
}
@keyframes rainbowShift { to { background-position:200% center; } }
.screen-sub { font-size:1rem; opacity:0.5; letter-spacing:0.05em; }
.name-input {
  font-family:'Fredoka One',cursive; font-size:1.1rem;
  background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.2);
  border-radius:50px; padding:12px 28px; color:white;
  outline:none; text-align:center; width:280px; transition:border-color 0.2s;
}
.name-input:focus { border-color:var(--pink); }
.name-input::placeholder { opacity:0.3; }
.play-btn {
  font-family:'Fredoka One',cursive; font-size:1.2rem; padding:14px 50px;
  border:none; cursor:pointer; border-radius:50px;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  color:white; box-shadow:0 4px 30px rgba(247,37,133,0.5); transition:all 0.2s; letter-spacing:0.05em;
  pointer-events:all;
}
.play-btn:hover { transform:scale(1.05); box-shadow:0 6px 40px rgba(247,37,133,0.7); }
.play-btn:active { transform:scale(0.97); }
.dead-stats { font-size:1rem; opacity:0.6; text-align:center; line-height:2.2; }
.dead-stats b { color:white; font-family:'Fredoka One',cursive; font-size:1.4rem; }
.skin-picker { display:flex; gap:10px; align-items:center; }
.skin-picker label { font-size:0.7rem; letter-spacing:0.1em; opacity:0.5; }
.skin-dot { width:28px; height:28px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:all 0.15s; pointer-events:all; }
.skin-dot:hover, .skin-dot.selected { border-color:white; transform:scale(1.2); }
#connecting-screen .spinner { font-size:3rem; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#player-count { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:0.7rem; opacity:0.3; font-weight:700; letter-spacing:0.1em; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="joystick-wrap">
  <div id="joystick-base"><div id="joystick-knob"></div></div>
</div>
<button id="boost-btn"><span>⚡</span>BOOST</button>

<div id="hud">
  <div id="ping-display">● <span id="pingVal">--</span>ms</div>
  <div id="score-display">🐍 Length: <span id="lengthVal">3</span></div>
  <div id="leaderboard"><h3>🏆 TOP SNAKEYS</h3><div id="lb-list"></div></div>
  <div id="boost-bar-wrap">
    <div id="boost-label">HOLD CLICK/SPACE TO BOOST ⚡ (costs length)</div>
  </div>
  <div id="controls-hint">MOUSE / WASD / ARROWS — steer<br>CLICK / SPACE — boost</div>
  <div id="kill-feed"></div>
  <div id="minimap-wrap"><canvas id="minimap" width="120" height="120"></canvas><div id="minimap-label">MAP</div></div>
  <div id="version-label">v1.07</div>
</div>

<div id="start-screen">
  <div class="screen-title">🌈 GAY GAMES</div>
  <div class="screen-sub">SLITHER EDITION ✨</div>
  <input class="name-input" id="nameInput" placeholder="your gay name..." maxlength="16" value="SnakeQueen">
  <div class="skin-picker">
    <label>SKIN</label>
    <div class="skin-dot selected" data-skin="0" style="background:linear-gradient(135deg,#F72585,#7B2FBE)"></div>
    <div class="skin-dot" data-skin="1" style="background:linear-gradient(135deg,#FFD166,#FF4B6E)"></div>
    <div class="skin-dot" data-skin="2" style="background:linear-gradient(135deg,#06D6A0,#4361EE)"></div>
    <div class="skin-dot" data-skin="3" style="background:linear-gradient(135deg,#4CC9F0,#F72585)"></div>
    <div class="skin-dot" data-skin="4" style="background:linear-gradient(135deg,#FF8C42,#06D6A0)"></div>
  </div>
  <button class="play-btn" id="startBtn">✨ SLAY ✨</button>
  <div id="player-count">🌍 <span id="onlineCount">...</span> players online</div>
</div>

<div id="connecting-screen">
  <div class="spinner">🌈</div>
  <div style="font-family:'Fredoka One',cursive;font-size:1.5rem;opacity:0.7">Connecting...</div>
</div>

<div id="dead-screen">
  <div style="font-family:'Fredoka One',cursive;font-size:3rem;background:linear-gradient(90deg,var(--red),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">💀 YOU DIED BESTIE</div>
  <div class="dead-stats">
    Final length: <b id="finalLen">0</b><br>
    Score: <b id="finalScore">0</b><br>
    Kills: <b id="finalKills">0</b><br>
    Killed by: <b id="killedBy">the void</b><br>
    Rank: <b id="finalRank">#?</b>
  </div>
  <button class="play-btn" id="restartBtn">💅 PLAY AGAIN 💅</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ─── Config ────────────────────────────────────────────────────────────────
const WORLD = 3000;
const FOOD_COLORS = ['#F72585','#FF8C42','#FFD166','#06D6A0','#4CC9F0','#7B2FBE','#C77DFF','#FF4B6E'];

// ─── State ────────────────────────────────────────────────────────────────
let ws = null;
let playerId = null;
let snakes = new Map();       // id -> snake data
let foods = new Map();        // id -> food
let orbs = new Map();         // id -> orb
let cam = { x: 0, y: 0 };
let mouse = { x: 0, y: 0 };
let boosting = false;
let boost = 100;
let playerScore = 0;
let selectedSkin = 0;
let running = false;
let animFrame = null;
let lastInput = { angle: 0, boosting: false };
let pingStart = 0, pingMs = 0;
let lastPing = 0;

// ─── Resize ────────────────────────────────────────────────────────────────
function resize() {
  // Simple, reliable: canvas pixel buffer = CSS pixels = game coordinate space
  // No DPR scaling — keeps coordinate system perfectly consistent everywhere
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', () => {
  resize();
  // Re-center camera on player after resize
  const player = snakes.get(playerId);
  if (player && player.segments && player.segments[0]) {
    cam.x = player.segments[0].x - cw() / 2;
    cam.y = player.segments[0].y - ch() / 2;
  }
});
resize();

// Canvas dimensions — always window size
function cw() { return canvas.width; }
function ch() { return canvas.height; }

// ─── WebSocket ────────────────────────────────────────────────────────────
const WS_URL = (() => {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}`;
})();

function connect(name, skinIdx) {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('connecting-screen').style.display = 'flex';

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', name, skin: skinIdx }));
  };

  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) {
      handleBinary(e.data);
    } else {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    }
  };

  ws.onclose = () => {
    running = false;
    cancelAnimationFrame(animFrame);
    // Show reconnect UI
    document.getElementById('dead-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'flex';
    document.getElementById('connecting-screen').style.display = 'none';
    addKillMsg('🔌 Disconnected from server');
  };

  ws.onerror = () => {
    document.getElementById('connecting-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'flex';
    addKillMsg('❌ Could not connect to server');
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'init': {
      playerId = msg.playerId;
      snakes.clear(); foods.clear(); orbs.clear(); snakeMeta.clear();
      for (const s of msg.snakes) {
        snakeMeta.set(s.id, { name: s.name, skin: s.skin });
        snakes.set(s.id, { ...s, serverHx: s.segments?.[0]?.x, serverHy: s.segments?.[0]?.y });
      }
      for (const f of msg.foods) foods.set(f.id, f);
      for (const o of msg.orbs) orbs.set(o.id, o);

      // Center camera on player
      const player = snakes.get(playerId);
      if (player && player.segments.length) {
        cam.x = player.segments[0].x - cw() / 2;
        cam.y = player.segments[0].y - ch() / 2;
      }

      document.getElementById('connecting-screen').style.display = 'none';
      running = true;
      animFrame = requestAnimationFrame(gameLoop);
      break;
    }

    case 'state': {
      // Update snakes from server
      for (const su of msg.snakes) {
        const existing = snakes.get(su.id);
        if (existing) {
          // All snakes: use server positions directly
          // Server now runs at 60fps so positions are always fresh
          if (su.segments && su.segments.length > 0) {
            if (existing.segments.length === 0) {
              // First update — snap to server position
              existing.segments = su.segments;
            } else {
              // Smooth lerp toward server position to avoid jitter
              const dx = su.segments[0].x - existing.segments[0].x;
              const dy = su.segments[0].y - existing.segments[0].y;
              const d = Math.hypot(dx, dy);
              if (d > 50) {
                // Too far — snap
                existing.segments = su.segments;
              } else {
                // Snap to server positions — server is authoritative at 20fps,
                // the render loop runs at 60fps and smooths via camera lerp
                existing.segments = su.segments;
              }
            }
            existing.fullLength = su.fullLength || su.segments.length;
            // Trim to server length
            while (existing.segments.length > (existing.fullLength || 0) + 4) existing.segments.pop();
          }
          existing.angle = su.angle;
          existing.radius = su.radius;
          existing.boosting = su.boosting;
          existing.alive = true; // server only sends alive snakes in state
        } else {
          // New snake — add it
          snakes.set(su.id, { ...su, alive: true, segments: su.segments ? [...su.segments] : [] });
        }
      }
      // Sync orbs — server sends complete nearby list
      const serverOrbIds = new Set(msg.orbs.map(o => o.id));
      for (const [id] of orbs) { if (!serverOrbIds.has(id)) orbs.delete(id); }
      for (const o of msg.orbs) orbs.set(o.id, o);

      // Sync nearby foods from server (authoritative — removes eaten ghost foods)
      if (msg.foods && msg.foods.length > 0) {
        const serverFoodIds = new Set(msg.foods.map(f => f.id));
        // Only remove foods that are in our current view range (don't remove far-away foods)
        const player2 = snakes.get(playerId);
        if (player2 && player2.segments && player2.segments[0]) {
          const ph = player2.segments[0];
          for (const [id, f] of foods) {
            const d = Math.hypot(f.x - ph.x, f.y - ph.y);
            if (d < 800 && !serverFoodIds.has(id)) foods.delete(id);
          }
        }
        for (const f of msg.foods) { if (!foods.has(f.id)) foods.set(f.id, f); }
      }

      // Update player length and score
      playerScore = msg.playerScore ?? playerScore;
      // Update player fullLength from server
      const pSnake = snakes.get(playerId);
      if (pSnake && msg.playerLength) pSnake.fullLength = msg.playerLength;

      // Remove snakes that are no longer in range (not in this state update)
      // This prevents frozen ghost snakes when bots go out of broadcast range
      if (msg.snakes && msg.snakes.length > 0) {
        const activeIds = new Set(msg.snakes.map(s => s.id));
        activeIds.add(playerId); // always keep player
        for (const [id] of snakes) {
          if (!activeIds.has(id)) snakes.delete(id);
        }
      }

      // Update leaderboard (fallback if still JSON state)
      if (msg.leaderboard) handleLeaderboard(msg.leaderboard);
      break;
    }

    case 'leaderboard': {
      handleLeaderboard(msg.data);
      break;
    }

    case 'player_joined': {
      snakeMeta.set(msg.snake.id, { name: msg.snake.name, skin: msg.snake.skin });
      snakes.set(msg.snake.id, { ...msg.snake, serverHx: msg.snake.segments?.[0]?.x, serverHy: msg.snake.segments?.[0]?.y });
      break;
    }

    case 'player_left': {
      snakes.delete(msg.id);
      break;
    }

    case 'snake_died': {
      const s = snakes.get(msg.id);
      if (s) s.alive = false;
      if (msg.orbs) for (const o of msg.orbs) orbs.set(o.id, o);

      if (msg.killerId === playerId) {
        addKillMsg(`💀 You slayed ${s?.name || '?'}!`);
      }
      setTimeout(() => snakes.delete(msg.id), 2000);
      break;
    }

    case 'food_eaten': {
      foods.delete(msg.id); // Remove eaten food immediately
      const s = snakes.get(msg.snakeId);
      if (s) s.fullLength = msg.newLength;
      break;
    }

    case 'orb_eaten': {
      orbs.delete(msg.id);
      break;
    }

    case 'you_died': {
      running = false;
      cancelAnimationFrame(animFrame);
      document.getElementById('finalLen').textContent = msg.length;
      document.getElementById('finalScore').textContent = msg.score;
      document.getElementById('finalKills').textContent = msg.kills;
      document.getElementById('killedBy').textContent = msg.killerName;
      document.getElementById('finalRank').textContent = '#' + msg.rank;
      setTimeout(() => { document.getElementById('dead-screen').style.display = 'flex'; }, 800);
      break;
    }

    case 'respawned': {
      playerId = msg.playerId;
      snakes.set(msg.snake.id, msg.snake);
      running = true;
      animFrame = requestAnimationFrame(gameLoop);
      document.getElementById('dead-screen').style.display = 'none';
      break;
    }
  }
}

// ─── Binary state handler ──────────────────────────────────────────────────
const FOOD_COLORS_CLIENT = ['#F72585','#FF8C42','#FFD166','#06D6A0','#4CC9F0','#7B2FBE','#C77DFF','#FF4B6E'];
const SKINS_CLIENT = [
  ['#F72585','#7B2FBE','#C77DFF'],['#FFD166','#FF4B6E','#FF8C42'],
  ['#06D6A0','#4361EE','#4CC9F0'],['#4CC9F0','#F72585','#7B2FBE'],
  ['#FF8C42','#06D6A0','#FFD166'],['#9B5DE5','#F72585','#4CC9F0'],
  ['#FF4B6E','#FFD166','#06D6A0'],['#4361EE','#06D6A0','#F72585'],
];

// Snake name/meta cache — populated from JSON messages, persists across binary updates
const snakeMeta = new Map(); // id -> { name, skin }

function handleBinary(buf) {
  const view = new DataView(buf);
  let off = 0;

  const pktType    = view.getUint8(off++);
  if (pktType !== 0x01) return; // only handle state packets

  const snakeCount = view.getUint16(off, true); off += 2;
  const foodCount  = view.getUint16(off, true); off += 2;
  const orbCount   = view.getUint16(off, true); off += 2;

  const activeIds = new Set();
  activeIds.add(playerId);

  // Parse snakes
  for (let i = 0; i < snakeCount; i++) {
    const id       = view.getUint16(off, true);       off += 2;
    const hx       = view.getInt16(off, true) / 10;   off += 2; off++; // +padding
    const hy       = view.getInt16(off, true) / 10;   off += 2; off++; // +padding
    const angleByte= view.getUint8(off++);
    const flags    = view.getUint8(off++);
    const skinIdx  = view.getUint8(off++);
    const radius   = view.getUint8(off++) / 10;
    const fullLen  = view.getUint16(off, true);        off += 2;

    const angle    = (angleByte / 255) * Math.PI * 2;
    const boosting = !!(flags & 0x01);
    const isPlayer = !!(flags & 0x02);
    const skin     = SKINS_CLIENT[skinIdx % SKINS_CLIENT.length];

    activeIds.add(id);

    const existing = snakes.get(id);
    if (existing) {
      // Update head, reconstruct body below in game loop
      existing.serverHx  = hx;
      existing.serverHy  = hy;
      existing.angle     = angle;
      existing.boosting  = boosting;
      existing.radius    = radius;
      existing.fullLength= fullLen;
      existing.alive     = true;
      existing.skin      = skin;
    } else {
      // New snake — init with segments at head position
      const meta = snakeMeta.get(id) || {};
      const segs = [];
      for (let j = 0; j < Math.max(8, fullLen); j++) segs.push({ x: hx, y: hy });
      snakes.set(id, {
        id, alive: true, angle, boosting, radius, fullLength: fullLen,
        skin, segments: segs,
        name: meta.name || '...',
        serverHx: hx, serverHy: hy,
      });
    }

    if (isPlayer && id !== playerId) playerId = id;
  }

  // Remove snakes no longer nearby
  for (const [id] of snakes) {
    if (!activeIds.has(id)) snakes.delete(id);
  }

  // Parse foods
  const newFoodIds = new Set();
  for (let i = 0; i < foodCount; i++) {
    const id    = view.getUint16(off, true);                           off += 2;
    const fx    = view.getInt16(off, true);                            off += 2;
    const fy    = view.getInt16(off, true);                            off += 2;
    const cIdx  = view.getUint8(off++);
    const r     = view.getUint8(off++);
    newFoodIds.add(id);
    if (!foods.has(id)) foods.set(id, { id, x: fx, y: fy, color: FOOD_COLORS_CLIENT[cIdx % FOOD_COLORS_CLIENT.length], r });
  }
  // Remove stale nearby foods
  const player = snakes.get(playerId);
  if (player && player.segments[0]) {
    const ph = player.segments[0];
    for (const [id, f] of foods) {
      const d2 = (f.x - ph.x) ** 2 + (f.y - ph.y) ** 2;
      if (d2 < 800 * 800 && !newFoodIds.has(id)) foods.delete(id);
    }
  }

  // Parse orbs
  orbs.clear();
  for (let i = 0; i < orbCount; i++) {
    const id    = view.getUint16(off, true);                           off += 2;
    const ox    = view.getInt16(off, true);                            off += 2;
    const oy    = view.getInt16(off, true);                            off += 2;
    const cIdx  = view.getUint8(off++);
    const r     = view.getUint8(off++);
    orbs.set(id, { id, x: ox, y: oy, color: FOOD_COLORS_CLIENT[cIdx % FOOD_COLORS_CLIENT.length], r });
  }

  // Parse score tail (JSON suffix after binary block)
  try {
    const tail = new TextDecoder().decode(new Uint8Array(buf, off));
    if (tail.startsWith(',')) {
      const sc = JSON.parse(tail.slice(1));
      if (sc.sc !== undefined) playerScore = sc.sc;
      const ps = snakes.get(playerId);
      if (ps && sc.ln) ps.fullLength = sc.ln;
    }
  } catch(_) {}
}

// ─── Client-side body reconstruction (runs every frame, like slither.io) ────
// Each segment chases the one ahead of it — no server bandwidth needed for body
const SEGMENT_SPACING = 2.2; // matches server BASE_SPEED
function reconstructBodies() {
  for (const s of snakes.values()) {
    if (!s.alive || !s.serverHx) continue;

    // Move head toward server position
    const head = s.segments[0];
    if (head) {
      head.x += (s.serverHx - head.x) * 0.35;
      head.y += (s.serverHy - head.y) * 0.35;
    }

    // Each subsequent segment follows the one ahead
    const targetLen = s.fullLength || s.segments.length;
    while (s.segments.length < targetLen) s.segments.push({ ...s.segments[s.segments.length - 1] });
    while (s.segments.length > targetLen + 2) s.segments.pop();

    for (let i = 1; i < s.segments.length; i++) {
      const leader = s.segments[i - 1];
      const seg    = s.segments[i];
      const dx = leader.x - seg.x;
      const dy = leader.y - seg.y;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d > SEGMENT_SPACING) {
        const ratio = (d - SEGMENT_SPACING) / d;
        seg.x += dx * ratio;
        seg.y += dy * ratio;
      }
    }
  }
}

// Also handle leaderboard JSON messages
function handleLeaderboard(data) {
  minimapData = data;
  updateLeaderboard(data);
  // Update snake names from leaderboard
  for (const e of data) {
    snakeMeta.set(e.id, { name: e.name });
    const s = snakes.get(e.id);
    if (s) s.name = e.name;
  }
}

// ─── Input sending ─────────────────────────────────────────────────────────
function sendInput() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const player = snakes.get(playerId);
  if (!player || !player.alive) return;

  const head = player.segments[0];
  if (!head) return;

  const wx = cam.x + mouse.x;
  const wy = cam.y + mouse.y;
  const angle = Math.atan2(wy - head.y, wx - head.x);

  // Send every frame for maximum responsiveness (small messages, worth it)
  ws.send(JSON.stringify({ type: 'input', angle, boosting }));
  lastInput = { angle, boosting };
}

// Ping
function sendPing() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  pingStart = performance.now();
  ws.send(JSON.stringify({ type: 'ping' }));
}

// ─── Game loop ─────────────────────────────────────────────────────────────
let lastFrame = 0;
function gameLoop(ts) {
  if (!running) return;
  const dt = Math.min((ts - lastFrame) / 1000 * 60, 4);
  lastFrame = ts;

  applyKeyboardSteering();
  updateCursor(mouse.x, mouse.y);
  sendInput();
  reconstructBodies(); // client-side body simulation — slither.io style
  if (ts - lastPing > 2000) { lastPing = ts; /* sendPing(); */ }

  // No client-side prediction — server runs at 60fps so we just use server positions
  // This ensures food pickup and collision always match what you see
  const player = snakes.get(playerId);
  if (player && player.alive && player.segments.length > 0) {
    // Smooth camera follow based on server head position
    const head = player.segments[0];
    const tx = head.x - cw() / 2;
    const ty = head.y - ch() / 2;
    cam.x += (tx - cam.x) * 0.2;
    cam.y += (ty - cam.y) * 0.2;
  }

  // Animate food
  for (const f of foods.values()) {
    f.pulse = (f.pulse || 0) + dt * 0.05;
  }

  render();
  updateHUD();
  drawMinimap();
  animFrame = requestAnimationFrame(gameLoop);
}

// ─── Render ────────────────────────────────────────────────────────────────
function render() {
  ctx.fillStyle = '#08000F';
  ctx.fillRect(0, 0, cw(), ch());

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  const gs = 80;
  for (let x = -(cam.x % gs); x < cw(); x += gs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = -(cam.y % gs); y < ch(); y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // World border — flashes red when near edge
  const _pb = snakes.get(playerId);
  let _bwarn = false;
  if (_pb && _pb.segments && _pb.segments[0]) {
    const _ph = _pb.segments[0];
    _bwarn = Math.min(_ph.x, _ph.y, WORLD-_ph.x, WORLD-_ph.y) < 300;
  }
  ctx.strokeStyle = _bwarn ? ('rgba(255,50,50,' + (0.5 + 0.4*Math.abs(Math.sin(Date.now()/150))) + ')') : 'rgba(247,37,133,0.35)';
  ctx.lineWidth = _bwarn ? 10 : 5;
  ctx.strokeRect(-cam.x, -cam.y, WORLD, WORLD);
  if (_bwarn) { ctx.fillStyle='rgba(255,0,0,0.05)'; ctx.fillRect(-cam.x,-cam.y,WORLD,WORLD); }

  const vx1 = cam.x - 40, vy1 = cam.y - 40;
  const vx2 = cam.x + cw() + 40, vy2 = cam.y + ch() + 40;

  // Foods
  for (const f of foods.values()) {
    if (f.x < vx1 || f.x > vx2 || f.y < vy1 || f.y > vy2) continue;
    const fx = f.x - cam.x, fy = f.y - cam.y;
    const pr = f.r * (0.85 + 0.15 * Math.sin(f.pulse || 0));
    ctx.save();
    ctx.shadowColor = f.color; ctx.shadowBlur = 6;
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(fx, fy, Math.max(0.5, pr), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(fx - pr * 0.2, fy - pr * 0.2, Math.max(0.5, pr * 0.3), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Orbs
  for (const o of orbs.values()) {
    if (o.x < vx1 || o.x > vx2 || o.y < vy1 || o.y > vy2) continue;
    const ox = o.x - cam.x, oy = o.y - cam.y;
    ctx.save();
    ctx.shadowColor = o.color; ctx.shadowBlur = 12;
    ctx.fillStyle = o.color;
    ctx.beginPath(); ctx.arc(ox, oy, Math.max(0.5, o.r), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Snakes
  const sortedSnakes = [...snakes.values()].sort((a, b) => {
    if (a.id === playerId) return 1;
    if (b.id === playerId) return -1;
    return 0;
  });

  for (const s of sortedSnakes) {
    if (!s.alive || !s.segments || !s.segments.length) continue;
    if (s.segments[0].x < vx1 - 100 || s.segments[0].x > vx2 + 100 ||
        s.segments[0].y < vy1 - 100 || s.segments[0].y > vy2 + 100) continue;
    drawSnake(s);
  }
}

function drawSnake(s) {
  const segs = s.segments;
  const r = s.radius || 6;
  const skin = s.skin || ['#F72585', '#7B2FBE', '#C77DFF'];
  const isPlayer = s.id === playerId;

  for (let i = segs.length - 1; i >= 0; i--) {
    const seg = segs[i];
    const sx = seg.x - cam.x, sy = seg.y - cam.y;
    if (sx < -20 || sx > cw() + 20 || sy < -20 || sy > ch() + 20) continue;

    const t = i / segs.length;
    const segR = i === 0 ? r * 1.15 : Math.max(r * 0.5, r * (1 - t * 0.3));
    const colorIdx = Math.floor(t * skin.length);

    ctx.fillStyle = skin[colorIdx % skin.length];
    if (i === 0) { ctx.shadowColor = skin[0]; ctx.shadowBlur = isPlayer ? 18 : 10; }
    else ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(0.5, segR), 0, Math.PI * 2);
    ctx.fill();

    // Shine
    if (i === 0 || i % 4 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath();
      ctx.arc(sx - segR * 0.25, sy - segR * 0.25, Math.max(0.3, segR * 0.38), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;

  // Head details
  const hx = segs[0].x - cam.x, hy = segs[0].y - cam.y;
  const angle = s.angle || 0;

  // Eyes
  const ex1 = hx + Math.cos(angle - 0.5) * r * 0.7;
  const ey1 = hy + Math.sin(angle - 0.5) * r * 0.7;
  const ex2 = hx + Math.cos(angle + 0.5) * r * 0.7;
  const ey2 = hy + Math.sin(angle + 0.5) * r * 0.7;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex1, ey1, Math.max(0.5, r * 0.32), 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2, ey2, Math.max(0.5, r * 0.32), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(ex1 + Math.cos(angle) * r * 0.1, ey1 + Math.sin(angle) * r * 0.1, Math.max(0.3, r * 0.17), 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2 + Math.cos(angle) * r * 0.1, ey2 + Math.sin(angle) * r * 0.1, Math.max(0.3, r * 0.17), 0, Math.PI * 2); ctx.fill();

  // Name tag
  if (r > 4) {
    const fs = Math.max(10, Math.min(14, r * 1.1));
    ctx.font = `bold ${fs}px Nunito, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(s.name, hx + 1, hy - r * 1.6 + 1);
    ctx.fillStyle = isPlayer ? '#FFD166' : 'white';
    ctx.fillText(s.name, hx, hy - r * 1.6);
  }
}

let minimapData = [];

function drawMinimap() {
  const mc = document.getElementById('minimap');
  if (!mc || !running) return;
  const mctx = mc.getContext('2d');
  const MW = mc.width, MH = mc.height;
  const scale = MW / WORLD;

  mctx.clearRect(0, 0, MW, MH);
  mctx.fillStyle = 'rgba(0,0,0,0.75)';
  mctx.fillRect(0, 0, MW, MH);
  mctx.strokeStyle = 'rgba(247,37,133,0.6)';
  mctx.lineWidth = 1;
  mctx.strokeRect(0.5, 0.5, MW-1, MH-1);

  // Snake dots from leaderboard positions
  for (const e of minimapData) {
    const mx = e.x * scale;
    const my = e.y * scale;
    const isMe = e.id === playerId;
    mctx.beginPath();
    mctx.arc(mx, my, isMe ? 4 : 2, 0, Math.PI*2);
    mctx.fillStyle = isMe ? '#FFD166' : (e.isBot ? 'rgba(100,200,255,0.7)' : '#F72585');
    if (isMe) { mctx.shadowColor='#FFD166'; mctx.shadowBlur=6; }
    mctx.fill();
    mctx.shadowBlur = 0;
  }

  // Viewport box
  const player = snakes.get(playerId);
  if (player && player.segments && player.segments[0]) {
    const ph = player.segments[0];
    const vx = Math.max(0, (ph.x - cw()/2) * scale);
    const vy = Math.max(0, (ph.y - ch()/2) * scale);
    const vw = Math.min(MW - vx, cw() * scale);
    const vh = Math.min(MH - vy, ch() * scale);
    mctx.strokeStyle = 'rgba(255,255,255,0.25)';
    mctx.lineWidth = 0.75;
    mctx.strokeRect(vx, vy, vw, vh);
  }
}

function updateHUD() {
  const player = snakes.get(playerId);
  const len = player?.fullLength || player?.segments?.length || 0;
  document.getElementById('lengthVal').textContent = len;
}

function updateLeaderboard(lb) {
  if (!lb) return;
  const el = document.getElementById('lb-list');

    const isMe = e.id === playerId;

    return `<div class="lb-entry" style="${isMe ? 'color:#FFD166' : ''}">
      <span>${medal} ${e.name}</span><span style="font-family:'Fredoka One',cursive">${e.length}</span>
    </div>`;
  }).join('');
}

function addKillMsg(msg) {

// ─── Custom cursor ──────────────────────────────────────────────────────────
const cursorEl = document.createElement('div');
cursorEl.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);display:none;';
document.body.appendChild(cursorEl);
let cursorVisible = false;

function updateCursor(cx, cy) {
  if (!running) return;
  cursorEl.style.left = cx + 'px';
  cursorEl.style.top = cy + 'px';
  if (!cursorVisible) { cursorEl.style.display = 'block'; cursorVisible = true; }
  const b = boost / 100;
  const isBoosting = boosting;
  const size = isBoosting ? 26 : 20;
  const rc = isBoosting ? '#FFD166' : '#F72585';
  const r = size - 3;
  const circ = Math.PI * 2 * r;
  cursorEl.innerHTML = `<svg width="${size*2}" height="${size*2}" viewBox="0 0 ${size*2} ${size*2}" style="display:block;margin:-${size}px 0 0 -${size}px">
    <circle cx="${size}" cy="${size}" r="${r}" fill="none" stroke="${rc}" stroke-width="2.5" stroke-opacity="0.9"
      stroke-dasharray="${circ}" stroke-dashoffset="${(1-b)*circ}"
      stroke-linecap="round" transform="rotate(-90 ${size} ${size})"/>
    <circle cx="${size}" cy="${size}" r="3.5" fill="${rc}" fill-opacity="0.9"/>
    <line x1="${size}" y1="${size-8}" x2="${size}" y2="${size-13}" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="${size}" y1="${size+8}" x2="${size}" y2="${size+13}" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="${size-8}" y1="${size}" x2="${size-13}" y2="${size}" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="${size+8}" y1="${size}" x2="${size+13}" y2="${size}" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  </svg>`;
}

// ─── Keyboard steering ───────────────────────────────────────────────────────
const keys = {};
// Virtual mouse position for keyboard steering — starts at center
let keyMouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
const KEY_SPEED = 8; // pixels per frame the virtual cursor moves

function applyKeyboardSteering() {
  if (!running) return;
  let dx = 0, dy = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) dx -= KEY_SPEED;
  if (keys['ArrowRight'] || keys['KeyD']) dx += KEY_SPEED;
  if (keys['ArrowUp']    || keys['KeyW']) dy -= KEY_SPEED;
  if (keys['ArrowDown']  || keys['KeyS']) dy += KEY_SPEED;
  if (dx !== 0 || dy !== 0) {
    // Move virtual cursor in the direction held
    keyMouse.x = window.innerWidth / 2 + dx * 40;
    keyMouse.y = window.innerHeight / 2 + dy * 40;
    // Only override real mouse if keyboard is being used
    mouse.x = keyMouse.x;
    mouse.y = keyMouse.y;
  }
}

// Joystick state
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
let joystickActive = false;
let joystickOrigin = { x: 0, y: 0 };
const JOYSTICK_MAX = 36;

function updateJoystick(tx, ty) {
  const rect = joystickBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  joystickOrigin = { x: cx, y: cy };
  const dx = tx - cx, dy = ty - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const clamped = Math.min(dist, JOYSTICK_MAX);
  const angle = Math.atan2(dy, dx);
  const kx = Math.cos(angle) * clamped;
  const ky = Math.sin(angle) * clamped;
  joystickKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
  // Project virtual mouse far in that direction from screen center
  mouse.x = window.innerWidth / 2 + Math.cos(angle) * 200;
  mouse.y = window.innerHeight / 2 + Math.sin(angle) * 200;
}

function resetJoystick() {
  joystickKnob.style.transform = 'translate(-50%, -50%)';
  joystickActive = false;
}

joystickBase.addEventListener('touchstart', e => {
  e.preventDefault();
  joystickActive = true;
  updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

joystickBase.addEventListener('touchmove', e => {
  e.preventDefault();
  if (joystickActive) updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

joystickBase.addEventListener('touchend', () => { resetJoystick(); });

// Boost button
const boostBtn = document.getElementById('boost-btn');
boostBtn.addEventListener('touchstart', e => { e.preventDefault(); boosting = true; });
boostBtn.addEventListener('touchend', () => boosting = false);

// Fallback — tap anywhere on canvas to boost on mobile
canvas.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchstart', e => {
  // Only if not hitting joystick or boost btn
  const t = e.touches[0];
  const joystickRect = joystickBase.getBoundingClientRect();
  const boostRect = boostBtn.getBoundingClientRect();
  const inJoystick = t.clientX >= joystickRect.left && t.clientX <= joystickRect.right && t.clientY >= joystickRect.top && t.clientY <= joystickRect.bottom;
  const inBoost = t.clientX >= boostRect.left && t.clientX <= boostRect.right && t.clientY >= boostRect.top && t.clientY <= boostRect.bottom;
  if (!inJoystick && !inBoost) { boosting = true; }
});
canvas.addEventListener('touchend', () => boosting = false);

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { boosting = true; e.preventDefault(); }
  // Prevent arrow keys from scrolling page
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space') boosting = false;
});

  connect(name, selectedSkin);
});

document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('dead-screen').style.display = 'none';
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'respawn' }));
    running = true;
    animFrame = requestAnimationFrame(gameLoop);
  } else {
    // Reconnect
    const name = document.getElementById('nameInput').value.trim() || 'SnakeQueen';
    connect(name, selectedSkin);
  }
});

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('startBtn').click();
});

// Fetch online count periodically
async function fetchOnlineCount() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    document.getElementById('onlineCount').textContent = data.players;
  } catch {}
}
fetchOnlineCount();
setInterval(fetchOnlineCount, 10000);

// Prevent iOS scroll bounce
document.body.addEventListener('touchmove', e => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
// Show joystick when game starts
function showMobileControls() {
  if (isMobile) {
    document.getElementById('joystick-wrap').style.display = 'block';
    document.getElementById('boost-btn').style.display = 'flex';
  }
}
</script>
</body>
</html>
